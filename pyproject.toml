[project]
name = "kover-fastapi-crud"
version = "0.1.0"
description = "Asynchronous book CRUD API with FastAPI, Pydantic v2 and Kover"
readme = "README.md"
authors = [
    { name = "megawattka", email = "killedbyshinku@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bson>=0.4.0",
    "fastapi>=0.162.2",
    "kover>=3.2.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
bson = { index = "bson" }

[[tool.uv.index]]
name = "bson"
url = "https://python.wattka.dev/"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: tests with real mongodb."]
